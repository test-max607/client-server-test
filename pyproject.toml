[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["server/proto/*_pb2.py", "server/proto/*_pb2_grpc.py", "docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["server/tests", "client/tests"]
pythonpath = ["."]
filterwarnings = ["error::ResourceWarning"]
